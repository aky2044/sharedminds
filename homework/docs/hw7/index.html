<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Minds — Bioluminescent Ocean</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Ocean (always present behind everything) -->
  <canvas id="oceanCanvas"></canvas>

  <!-- Phase 1: Google sign-in -->
  <div id="nameScreen" class="screen">
    <div class="name-box">
      <h1>BIOLUMINESCENT OCEAN</h1>
      <p class="subtitle">A collaborative drawing experience</p>
      <p class="auth-prompt">Sign in with Google to verify your identity</p>
      <button id="googleSignInBtn" type="button" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="authError" class="auth-error hidden"></p>
    </div>
  </div>

  <!-- Phase 2: Draw creature -->
  <div id="drawScreen" class="screen hidden">
    <div class="draw-box">
      <p class="prompt">Draw a bioluminescent creature</p>
      <canvas id="drawCanvas"></canvas>
      <div class="draw-controls">
        <input type="range" id="brushSize" min="1" max="16" value="3">
        <button id="undoBtn">Undo</button>
        <button id="eraseBtn">Eraser</button>
        <button id="clearDrawBtn">Clear</button>
        <button id="doneBtn">Done</button>
      </div>
    </div>
  </div>

  <!-- Floating button for drawing another creature (ocean phase) -->
  <button id="newCreatureBtn" class="hidden">+ New Creature</button>

  <script type="module" src="app.js"></script>
</body>
</html>
