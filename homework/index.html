<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Sync</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/addons/p5.sound.min.js"></script>
  <script src="https://p5livemedia.itp.io/simplepeer.min.js"></script>
  <script src="https://p5livemedia.itp.io/socket.io.js"></script>
  <script src="https://p5livemedia.itp.io/p5livemedia.js"></script>
</head>
<body>

  <!-- Name entry -->
  <div id="name-screen" class="screen-overlay active">
    <input id="name-input" type="text" placeholder="enter your name" maxlength="20" autocomplete="off" spellcheck="false">
    <button id="name-btn">enter</button>
  </div>

  <!-- Pairing popup -->
  <div id="pair-popup" class="screen-overlay">
    <p class="pair-text" id="pair-text"></p>
    <div class="pair-buttons" id="pair-buttons"></div>
  </div>

  <!-- Activity overlay (waiting to start) -->
  <div id="activity-overlay" class="screen-overlay">
    <p class="overlay-text">your interaction will start once a user presses enter.<br>pause the timer to stop and see your results.</p>
  </div>

  <!-- Activity HUD (timer + pause) -->
  <div id="activity-hud">
    <span class="timer" id="timer">00:00.0</span>
    <button class="pause-btn" id="pause-btn">pause</button>
  </div>

  <!-- Results screen -->
  <div id="results-screen" class="screen-overlay">
    <p class="results-text" id="results-text"></p>
    <div class="snapshot-wrap" id="snapshot-wrap"></div>
    <div class="results-actions">
      <button id="save-btn">save image</button>
      <button id="results-btn">return to lobby</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
